<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tic tac toe</title>
  <link rel="stylesheet" href="styles.css">
  <script src="index.js" defer></script>
</head>
<body>
  <div class="container">
    <div id="gameboard">
      
    </div>
    <div id="controls">
      <input type="text" name="player1"  id="player1" placeholder="Player 1 name: ">
      <input type="text" name="player2"  id="player2" placeholder="Player 2 name: ">
      <button id="start-button" class="control-button">Start game</button>
      <button id="restart-game" class="control-button">Restart game</button>
    </div>
    <div id="message">
      <div id="player-turn"></div>
      <div id="score-message"></div>
    </div>
  </div>
</body>
</html>
